<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oferta Exclusiva</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        .headline {
            font-size: 32px;
            font-weight: bold;
            margin-top: 40px;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .highlight {
            color: #e74c3c;
        }

        .sub-headline {
            font-size: 18px;
            color: #cccccc;
            margin-bottom: 30px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            border: 2px solid #333;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .cta-button {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            box-shadow: 0 4px 0 #219653;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .cta-button:hover {
            background-color: #2ecc71;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #219653;
        }

        .footer {
            margin-top: 50px;
            font-size: 12px;
            color: #666;
            padding-bottom: 20px;
        }

        .footer a {
            color: #666;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="headline">Descubra Como Alcançar <span class="highlight">O Seu Maior Objetivo</span> Ainda Este Ano</h1>
        <p class="sub-headline">Assista ao vídeo abaixo até o final para entender o passo a passo...</p>

        <!-- Substitua a div abaixo pelo código de embed do vturb -->
        <div class="video-container">
            <!-- PLACEHOLDER PARA O EMBED DO VTURB -->
            <div style="display: flex; justify-content: center; align-items: center; height: 100%; width: 100%; position: absolute; top:0; left:0; color: #666;">
                Substitua isso pelo código de embed do seu vídeo Vturb
            </div>
            <!-- Exemplo de iframe Vturb (substitua pelo seu código real) -->
            <!-- <iframe src="..." allowfullscreen></iframe> -->
        </div>

        <!-- Botão de Compra -->
        <a href="#" class="cta-button" id="cta">Quero Acessar Agora</a>

        <div class="footer">
            <p>Copyright © 2026. Todos os direitos reservados.</p>
            <p><a href="#">Termos de Uso</a> | <a href="#">Políticas de Privacidade</a></p>
        </div>
    </div>

    <!-- Script para revelar o botão após um tempo (ex: 5 minutos = 300000ms) -->
    <!-- Se quiser que o botão já apareça de imediato, basta apagar este script. -->
    <script>
        /*
        document.getElementById('cta').style.display = 'none';
        setTimeout(function() {
            document.getElementById('cta').style.display = 'inline-block';
        }, 300000); // tempo em milissegundos (ex: 5 min)
        */
    </script>
</body>
</html>
